<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flashy Defense</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #2a1456, #0d0822 70%);
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #f4eafc; gap: 20px;
    }
    .emoji  { font-size: 64px; line-height: 1; }
    h1 {
      font-size: 32px; font-weight: 700;
      background: linear-gradient(90deg, #ffd25f, #ff7eb3, #88c9ff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hint { font-size: 14px; opacity: .65; }
    input {
      padding: 13px 22px; font-size: 18px; width: 240px;
      border-radius: 999px; border: 2px solid rgba(255,180,220,.45);
      background: rgba(255,255,255,.08); color: #f4eafc;
      outline: none; text-align: center; letter-spacing: .1em;
    }
    input:focus { border-color: rgba(255,180,220,.85); }
    button {
      padding: 13px 44px; font-size: 17px; font-weight: 700;
      border: none; border-radius: 999px; cursor: pointer;
      background: linear-gradient(90deg, #ffd25f, #ff7eb3);
      color: #2a0d3a; box-shadow: 0 6px 20px rgba(255,126,179,.4);
      transition: transform .1s;
    }
    button:hover  { transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    #error {
      font-size: 13px; color: #ff7eb3;
      min-height: 1.2em; opacity: 0; transition: opacity .2s;
    }
  </style>
</head>
<body>
  <div class="emoji">🦥</div>
  <h1>Flashy Defense</h1>
  <p class="hint">Enter the password to play</p>
  <input id="pw" type="password" placeholder="Password" autofocus />
  <button id="btn">Let me in 🌙</button>
  <p id="error">Wrong password — try again</p>

  <script>
    // Skip login if session is still valid
    if (Date.now() - parseInt(localStorage.getItem('fd_auth') || 0) < 86400000) {
      location.replace('game.html');
    }

    function checkPw(s) {
      if (s.length !== 7) return false;
      const k = [54, 55, 50, 6,  0,  4, 25];
      const t = [85, 84, 81, 51, 49, 51, 33];
      for (let i = 0; i < 7; i++) {
        if ((s.charCodeAt(i) ^ k[i]) !== t[i]) return false;
      }
      return true;
    }

    function attempt() {
      const val = document.getElementById('pw').value;
      if (checkPw(val)) {
        localStorage.setItem('fd_auth', Date.now());
        location.replace('game.html');
      } else {
        const err = document.getElementById('error');
        err.style.opacity = 1;
        setTimeout(() => err.style.opacity = 0, 2000);
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }

    document.getElementById('btn').addEventListener('click', attempt);
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') attempt();
    });
  </script>
</body>
</html>
